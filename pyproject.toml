[project]
name = "planer-handling"
version = "0.1.0"
description = "Motor de planificación de personal de handling: turnos, equipos y asignación de vuelos"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
planer = "planer_handling.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
